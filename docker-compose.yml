# Local: portas publicadas, sem Traefik.
# No Dokploy: docker compose -f docker-compose.yml -f docker-compose.dokploy.yml
# As labels já descrevem o roteamento no mesmo domínio.

x-traefik: &traefik
  traefik.enable: "true"
  traefik.docker.network: dokploy-network

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spl}
      POSTGRES_DB: ${POSTGRES_DB:-spl}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spl}:${POSTGRES_PASSWORD:-spl}@db:5432/${POSTGRES_DB:-spl}?schema=public
      PERSISTENCIA: prisma
      PORT: "3333"
      SEED_EXEMPLO: "true"
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,https://splsolucoes.com
      GITHUB_ADAPTER: fake
    ports: ["3333:3333"]
    depends_on:
      db:
        condition: service_healthy
    labels:
      <<: *traefik
      traefik.http.services.spl-api.loadbalancer.server.port: "3333"
      traefik.http.middlewares.spl-api-strip.stripprefix.prefixes: /api
      traefik.http.middlewares.spl-api-https.redirectscheme.scheme: https
      traefik.http.middlewares.spl-api-https.redirectscheme.permanent: "true"
      traefik.http.routers.spl-api.rule: Host(`splsolucoes.com`) && PathPrefix(`/api`)
      traefik.http.routers.spl-api.entrypoints: websecure
      traefik.http.routers.spl-api.priority: "100"
      traefik.http.routers.spl-api.service: spl-api
      traefik.http.routers.spl-api.middlewares: spl-api-strip
      traefik.http.routers.spl-api.tls.certresolver: letsencrypt
      traefik.http.routers.spl-api-web.rule: Host(`splsolucoes.com`) && PathPrefix(`/api`) && !PathPrefix(`/.well-known/acme-challenge/`)
      traefik.http.routers.spl-api-web.entrypoints: web
      traefik.http.routers.spl-api-web.priority: "100"
      traefik.http.routers.spl-api-web.service: spl-api
      traefik.http.routers.spl-api-web.middlewares: spl-api-https

  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333
    ports: ["3000:3000"]
    depends_on: [api]
    labels:
      <<: *traefik
      traefik.http.services.spl-hub.loadbalancer.server.port: "3000"
      traefik.http.middlewares.spl-hub-https.redirectscheme.scheme: https
      traefik.http.middlewares.spl-hub-https.redirectscheme.permanent: "true"
      traefik.http.routers.spl-hub.rule: Host(`splsolucoes.com`) && PathPrefix(`/hub`)
      traefik.http.routers.spl-hub.entrypoints: websecure
      traefik.http.routers.spl-hub.priority: "100"
      traefik.http.routers.spl-hub.service: spl-hub
      traefik.http.routers.spl-hub.tls.certresolver: letsencrypt
      traefik.http.routers.spl-hub-web.rule: Host(`splsolucoes.com`) && PathPrefix(`/hub`) && !PathPrefix(`/.well-known/acme-challenge/`)
      traefik.http.routers.spl-hub-web.entrypoints: web
      traefik.http.routers.spl-hub-web.priority: "100"
      traefik.http.routers.spl-hub-web.service: spl-hub
      traefik.http.routers.spl-hub-web.middlewares: spl-hub-https

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        VITE_API_URL: http://localhost:3333
    ports: ["8080:80"]
    labels:
      <<: *traefik
      traefik.http.services.spl-landing.loadbalancer.server.port: "80"
      traefik.http.middlewares.spl-landing-https.redirectscheme.scheme: https
      traefik.http.middlewares.spl-landing-https.redirectscheme.permanent: "true"
      traefik.http.middlewares.spl-www-apex.redirectregex.regex: ^https?://www\.splsolucoes\.com(.*)
      traefik.http.middlewares.spl-www-apex.redirectregex.replacement: https://splsolucoes.com$${1}
      traefik.http.middlewares.spl-www-apex.redirectregex.permanent: "true"
      traefik.http.routers.spl-landing.rule: Host(`splsolucoes.com`) && !PathPrefix(`/hub`) && !PathPrefix(`/api`)
      traefik.http.routers.spl-landing.entrypoints: websecure
      traefik.http.routers.spl-landing.priority: "1"
      traefik.http.routers.spl-landing.service: spl-landing
      traefik.http.routers.spl-landing.tls.certresolver: letsencrypt
      traefik.http.routers.spl-landing-web.rule: Host(`splsolucoes.com`) && !PathPrefix(`/hub`) && !PathPrefix(`/api`) && !PathPrefix(`/.well-known/acme-challenge/`)
      traefik.http.routers.spl-landing-web.entrypoints: web
      traefik.http.routers.spl-landing-web.priority: "1"
      traefik.http.routers.spl-landing-web.service: spl-landing
      traefik.http.routers.spl-landing-web.middlewares: spl-landing-https
      traefik.http.routers.spl-www.rule: Host(`www.splsolucoes.com`)
      traefik.http.routers.spl-www.entrypoints: websecure
      traefik.http.routers.spl-www.priority: "200"
      traefik.http.routers.spl-www.service: spl-landing
      traefik.http.routers.spl-www.middlewares: spl-www-apex
      traefik.http.routers.spl-www.tls.certresolver: letsencrypt
      traefik.http.routers.spl-www-web.rule: Host(`www.splsolucoes.com`) && !PathPrefix(`/.well-known/acme-challenge/`)
      traefik.http.routers.spl-www-web.entrypoints: web
      traefik.http.routers.spl-www-web.priority: "200"
      traefik.http.routers.spl-www-web.service: spl-landing
      traefik.http.routers.spl-www-web.middlewares: spl-www-apex

volumes:
  pgdata:
