# Arquivo único para o Dokploy. Caminho do compose: docker-compose.prod.yml
# Variáveis: copie .env.producao.example para o ambiente do projeto.
# A landing no GitHub Pages não muda com este arquivo.

x-traefik: &traefik
  traefik.enable: "true"
  traefik.docker.network: dokploy-network

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-spl}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spl}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spl}?schema=public
      PERSISTENCIA: prisma
      TAREFAS_REPO: prisma
      PORT: "3333"
      NODE_ENV: production
      SEED_EXEMPLO: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://splsolucoes.com}
      GITHUB_ADAPTER: ${GITHUB_ADAPTER:-fake}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_SENHA: ${BOOTSTRAP_ADMIN_SENHA:-}
      BOOTSTRAP_ADMIN_NOME: ${BOOTSTRAP_ADMIN_NOME:-}
      PAGES_DISPATCH_TOKEN: ${PAGES_DISPATCH_TOKEN:-}
      PAGES_DISPATCH_REPOSITORIO: ${PAGES_DISPATCH_REPOSITORIO:-splSolucoesTecnologicas/spl-hub}
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && node dist/main.js"]
    depends_on:
      db:
        condition: service_healthy
    networks: [interna, dokploy-network]
    labels:
      <<: *traefik
      traefik.http.routers.spl-api.rule: Host(`splsolucoes.com`) && PathPrefix(`/api`)
      traefik.http.routers.spl-api.entrypoints: websecure
      traefik.http.routers.spl-api.tls.certresolver: letsencrypt
      traefik.http.routers.spl-api.priority: "100"
      traefik.http.routers.spl-api.middlewares: spl-api-strip
      traefik.http.middlewares.spl-api-strip.stripprefix.prefixes: /api
      traefik.http.services.spl-api.loadbalancer.server.port: "3333"

  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://splsolucoes.com/api}
    restart: unless-stopped
    depends_on: [api]
    networks: [dokploy-network]
    labels:
      <<: *traefik
      traefik.http.routers.spl-hub.rule: Host(`splsolucoes.com`) && PathPrefix(`/hub`)
      traefik.http.routers.spl-hub.entrypoints: websecure
      traefik.http.routers.spl-hub.tls.certresolver: letsencrypt
      traefik.http.routers.spl-hub.priority: "100"
      traefik.http.services.spl-hub.loadbalancer.server.port: "3000"

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://splsolucoes.com/api}
    restart: unless-stopped
    networks: [dokploy-network]
    labels:
      <<: *traefik
      traefik.http.routers.spl-landing.rule: Host(`splsolucoes.com`) && !PathPrefix(`/hub`) && !PathPrefix(`/api`)
      traefik.http.routers.spl-landing.entrypoints: websecure
      traefik.http.routers.spl-landing.tls.certresolver: letsencrypt
      traefik.http.routers.spl-landing.priority: "1"
      traefik.http.services.spl-landing.loadbalancer.server.port: "80"

networks:
  interna:
  dokploy-network:
    external: true

volumes:
  pgdata:
    name: spl_pgdata
