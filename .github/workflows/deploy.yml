name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - blog-publicado

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Verificar tipos da landing
        run: pnpm --filter @spl/landing typecheck
      - name: Executar testes da landing
        run: pnpm --filter @spl/landing test
      - name: Compilar a landing
        run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Conferir o CNAME de produção
        run: test "$(tr -d '[:space:]' < dist/CNAME)" = "splsolucoes.com"
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
